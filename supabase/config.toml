project_id = "sproutbound-development"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[auth.third_party.auth0]
enabled = true
tenant = "dev-phu3idfk55gl1dkn"
tenant_region = "us"

# The hosted gateway rejects external Auth0 RS256 tokens (UNAUTHORIZED_ASYMMETRIC_JWT).
# Authentication remains mandatory in game-api: verifyPlayerToken checks the
# Auth0 JWKS signature, RS256, exact issuer/audience, expiry and authenticated role
# before any action or privileged database access. Data API/RLS still verify Auth0.
[functions.game-api]
verify_jwt = false

# Keep local background course jobs alive after the HTTP response.
[edge_runtime]
policy = "per_worker"
