<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081729">
  <title>Sproutbound — Enter the Greenhouse</title>
  <meta name="description" content="Your journey of growth begins here. Sign in to Sproutbound.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="auth0-spa-js.production.js" defer></script>
  <script src="config.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="scene">
    <div class="stars" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <div class="distant-village" aria-hidden="true"><span></span><span></span><span></span><i></i></div>
    <div class="greenhouse" aria-hidden="true">
      <div class="roof"></div><div class="frame f1"></div><div class="frame f2"></div><div class="frame f3"></div>
      <div class="shelf s1"></div><div class="shelf s2"></div><div class="lamp lamp1"></div><div class="lamp lamp2"></div>
      <div class="glow-plant"><i></i><b></b><em></em></div>
    </div>
    <div class="water" aria-hidden="true"></div>
    <div class="dock dock-left" aria-hidden="true"><span class="dock-lamp"></span></div>
    <div class="dock dock-right" aria-hidden="true"><span class="dock-lamp"></span></div>
    <div class="firefly fly1" aria-hidden="true"></div><div class="firefly fly2" aria-hidden="true"></div>

    <section class="login-card" aria-labelledby="brand-title">
      <img class="sprout-sprite" src="sprout-mascot.png" alt="A smiling sprout sitting on the card" />
      <div class="card-vine vine-left" aria-hidden="true">❧</div><div class="card-vine vine-right" aria-hidden="true">❧</div>
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 51V23M32 33C16 31 11 20 13 10c12 0 20 6 19 18M32 28C34 14 44 8 54 9c1 12-7 21-22 22"/><path d="M20 51h24"/></svg></div>
      <h1 id="brand-title">Sproutbound</h1>
      <div class="ornament" aria-hidden="true"><span></span><b>✦</b><span></span></div>
      <p class="tagline">Your journey of growth begins here.</p>

      <div id="signed-out" class="auth-view">
        <button class="enter-button" id="login" type="button"><span class="leaf-icon" aria-hidden="true">❧</span><span>Enter the Greenhouse</span><span class="leaf-icon flip" aria-hidden="true">❧</span></button>
        <div class="links"><button type="button" class="text-link" id="signup">Create an account</button></div>
      </div>
      <div id="signed-in" class="signed-in" hidden>
        <div class="avatar" aria-hidden="true">✿</div>
        <p class="welcome">Welcome back, <strong id="user-name">Gardener</strong>.</p>
        <p class="auth-note" id="user-email" hidden></p>
        <p class="auth-note">You’re signed in. Your garden will be here soon.</p>
        <button type="button" class="enter-button continue-button" id="logout"><span class="leaf-icon" aria-hidden="true">❧</span><span>Sign out</span><span class="leaf-icon flip" aria-hidden="true">❧</span></button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="card-footer"><span>❧</span><i></i><span>❧</span></div>
    </section>
    <p class="scene-caption">The Greenhouse · After dusk</p>
  </main>
</body>
</html>
